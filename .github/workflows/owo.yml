name: 一键生成 Android 签名文件 (自毁版)

on:
  workflow_dispatch:
    inputs:
      keystore_name:
        description: '签名文件名 (如 release.jks)'
        required: true
        default: 'release.jks'
      alias:
        description: '别名'
        required: true
        default: 'phpschool'
      password:
        description: '密码 (必须记住)'
        required: true
        default: ''
      validity:
        description: '有效期 (天数)'
        required: true
        default: '10000'
      dname_cn:
        description: '名字 (CN)'
        required: true
        default: 'PHPCampus'
      dname_ou:
        description: '部门 (OU)'
        required: true
        default: 'Dev'
      dname_o:
        description: '组织 (O)'
        required: true
        default: 'PHPCampus'
      dname_l:
        description: '城市 (L)'
        required: true
        default: 'Nantong'
      dname_st:
        description: '省份 (ST)'
        required: true
        default: 'Jiangsu'
      dname_c:
        description: '国家 (C)'
        required: true
        default: 'CN'

# ★ 需要写权限，因为我们要删除自己
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 屏蔽密码 (防止日志泄露)
        run: |
          # 让 GitHub 在日志里自动把密码打码变成 ***
          echo "::add-mask::${{ github.event.inputs.password }}"

      - name: 生成签名文件
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.event.inputs.keystore_name }}" \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity ${{ github.event.inputs.validity }} \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=${{ github.event.inputs.dname_cn }}, OU=${{ github.event.inputs.dname_ou }}, O=${{ github.event.inputs.dname_o }}, L=${{ github.event.inputs.dname_l }}, ST=${{ github.event.inputs.dname_st }}, C=${{ github.event.inputs.dname_c }}"

      - name: 上传签名文件供下载
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Output
          path: ${{ github.event.inputs.keystore_name }}

      - name: 自动销毁本工作流文件
        run: |
          # 用 GitHub API 删掉这个文件
          gh api --method DELETE repos/${{ github.repository }}/contents/.github/workflows/gen_keystore.yml \
            -f message="Auto-destroy: Keystore generated" \
            -f sha=$(gh api repos/${{ github.repository }}/contents/.github/workflows/gen_keystore.yml --jq .sha)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
