name: Auto Release Zip

on:
  workflow_dispatch:
    inputs:
      version:
        description: '填写版本号 (例如 v0.0.1-01，必填)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 处理版本号
        run: |
          RAW_VER="${{ github.event.inputs.version }}"
          
          # 如果没填版本号直接报错退出
          if [ -z "$RAW_VER" ]; then
            echo "❌ 错误：必须填写版本号！"
            exit 1
          fi

          # 去掉开头的 v 用于 zip 文件名
          CLEAN_VER="${RAW_VER#v}"
          
          # 确保 tag 名字是带 v 的
          if [[ "$RAW_VER" != v* ]]; then
            TAG_NAME="v${RAW_VER}"
          else
            TAG_NAME="${RAW_VER}"
          fi
          
          echo "VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "准备打包版本: $CLEAN_VER (对应 Tag: $TAG_NAME)"

      - name: 打包无壳 Zip (PCW)
        run: |
          zip -r "PCW-${VERSION}.zip" . -x "*.git*" "*.github*"

      - name: 生成草稿 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }}"
          files: PCW-${{ env.VERSION }}.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
