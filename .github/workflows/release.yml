name: Auto Release Zip

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: '选择发版类型'
        required: true
        options:
        - 正式版
        - 补丁版
        - 测试版

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动计算版本号
        run: |
          git fetch --tags
          
          # 1. 获取所有纯净正式版，找最大的 BASE (如 v0.0.1)
          ALL_BASES=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V)
          BASE=$(echo "$ALL_BASES" | tail -n 1)
          if [ -z "$BASE" ]; then BASE="v0.0.0"; fi
          
          # 获取当前最大补丁版
          ALL_PATCHES=$(git tag -l "${BASE}.*" | grep -E "^${BASE}\.[0-9]{2}$" | sort -V)
          LATEST_PATCH=$(echo "$ALL_PATCHES" | tail -n 1)
          
          TYPE="${{ github.event.inputs.release_type }}"
          
          if [ "$TYPE" == "正式版" ]; then
            if [ -n "$BASE" ]; then
              V_NUM=${BASE#v}
              MAJOR=$(echo $V_NUM | cut -d. -f1)
              MINOR=$(echo $V_NUM | cut -d. -f2)
              PATCH=$(echo $V_NUM | cut -d. -f3)
              NEW_PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            else
              NEW_TAG="v0.0.1"
            fi
            BASE=$NEW_TAG
            
          elif [ "$TYPE" == "补丁版" ]; then
            if [ -z "$LATEST_PATCH" ]; then
              NEW_TAG="${BASE}.01"
            else
              NUM=${LATEST_PATCH##*.}
              NUM=$((10#$NUM + 1))
              NEW_NUM=$(printf "%02d" $NUM)
              NEW_TAG="${BASE}.${NEW_NUM}"
            fi
            
          elif [ "$TYPE" == "测试版" ]; then
            # 获取当前补丁号，如果没有就是 00
            if [ -z "$LATEST_PATCH" ]; then
              PATCH_NUM="00"
            else
              PATCH_NUM=${LATEST_PATCH##*.}
            fi
            
            # 获取当前日期 (例如 25)
            TODAY=$(date +%d)
            
            # 找今天该补丁号下已有的测试版，格式如 v0.0.1.01.251
            PREFIX="${BASE}.${PATCH_NUM}.${TODAY}"
            TEST_TAGS=$(git tag -l "${PREFIX}*" | sort -V)
            
            if [ -z "$TEST_TAGS" ]; then
              NEW_TAG="${PREFIX}1"
            else
              LAST_TEST=$(echo "$TEST_TAGS" | tail -n 1)
              NUM=${LAST_TEST##*${TODAY}}
              NUM=$((10#$NUM + 1))
              NEW_TAG="${PREFIX}${NUM}"
            fi
          fi
          
          CLEAN_VER="${NEW_TAG#v}"
          echo "TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "✅ 计算完毕，准备打包: $NEW_TAG (类型: $TYPE)"

      - name: 打包无壳 Zip (PCW)
        run: |
          zip -r "PCW-${VERSION}.zip" . -x "*.git*" "*.github*"

      - name: 生成草稿 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }} (${{ github.event.inputs.release_type }})"
          files: PCW-${{ env.VERSION }}.zip
          draft: true
          prerelease: ${{ github.event.inputs.release_type == '测试版' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
