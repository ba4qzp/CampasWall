name: Auto Release Zip

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: '发版类型'
        required: true
        options:
        - 正式版
        - 补丁版
        - 测试版
      severity:
        type: choice
        description: '严重程度'
        required: true
        options:
        - 更新
        - 一般漏洞
        - 高危漏洞
        - 严重漏洞
      custom_version:
        description: '【可选】手动指定基础版本号（如 v0.1.0 或 v1.0.0），留空则自动推算'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # ==========================================
  # Job 1: 打包并生成草稿
  # ==========================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动计算版本号
        run: |
          git fetch --tags
          
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"
          TYPE="${{ github.event.inputs.release_type }}"
          
          # ★ 优先处理手动指定的跨版本号
          if [ -n "$CUSTOM_VER" ]; then
            if [[ "$CUSTOM_VER" != v* ]]; then
              NEW_TAG="v${CUSTOM_VER}"
            else
              NEW_TAG="${CUSTOM_VER}"
            fi
            echo "✅ 使用了手动指定的版本号: $NEW_TAG"
          else
            # 原有自动推算逻辑
            ALL_BASES=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V)
            BASE=$(echo "$ALL_BASES" | tail -n 1)
            if [ -z "$BASE" ]; then BASE="v0.0.0"; fi
            ALL_PATCHES=$(git tag -l "${BASE}.*" | grep -E "^${BASE}\.[0-9]{2}$" | sort -V)
            LATEST_PATCH=$(echo "$ALL_PATCHES" | tail -n 1)
            
            if [ "$TYPE" == "正式版" ]; then
              if [ -n "$BASE" ]; then
                V_NUM=${BASE#v}
                MAJOR=$(echo $V_NUM | cut -d. -f1)
                MINOR=$(echo $V_NUM | cut -d. -f2)
                PATCH=$(echo $V_NUM | cut -d. -f3)
                NEW_PATCH=$((PATCH + 1))
                NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              else
                NEW_TAG="v0.0.1"
              fi
            elif [ "$TYPE" == "补丁版" ]; then
              if [ -z "$LATEST_PATCH" ]; then
                NEW_TAG="${BASE}.01"
              else
                NUM=${LATEST_PATCH##*.}
                NUM=$((10#$NUM + 1))
                NEW_NUM=$(printf "%02d" $NUM)
                NEW_TAG="${BASE}.${NEW_NUM}"
              fi
            elif [ "$TYPE" == "测试版" ]; then
              if [ -z "$LATEST_PATCH" ]; then PATCH_NUM="00"; else PATCH_NUM=${LATEST_PATCH##*.}; fi
              TODAY=$(date +%d)
              PREFIX="${BASE}.${PATCH_NUM}.${TODAY}"
              TEST_TAGS=$(git tag -l "${PREFIX}*" | sort -V)
              if [ -z "$TEST_TAGS" ]; then NEW_TAG="${PREFIX}1"; else
                LAST_TEST=$(echo "$TEST_TAGS" | tail -n 1)
                NUM=${LAST_TEST##*${TODAY}}
                NUM=$((10#$NUM + 1))
                NEW_TAG="${PREFIX}${NUM}"
              fi
            fi
          fi
          
          CLEAN_VER="${NEW_TAG#v}"
          echo "TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "✅ 最终准备打包: $NEW_TAG"

      - name: 自动注入版本号到代码
        run: |
          sed -i "s/define('APP_VERSION', '.*');/define('APP_VERSION', 'v${VERSION}');/" src/init.php

      - name: 打包无壳 Zip (PCW) 并计算 SHA256
        run: |
          ZIP_NAME="PCW-${VERSION}.zip"
          zip -r "$ZIP_NAME" . -x "*.git*" "*.github*"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"

      - name: 生成官方来源证明 (Attestation)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'PCW-${{ env.VERSION }}.zip'

      - name: 下载证明文件
        run: |
          gh attestation download "PCW-${VERSION}.zip" -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成草稿 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "${{ github.event.inputs.severity == '严重漏洞' && '[CRITICAL] ' || (github.event.inputs.severity == '高危漏洞' && '[HIGH_BUG] ' || (github.event.inputs.severity == '一般漏洞' && '[LOW_BUG] ' || '[UPDATE] ')) }}Release ${{ env.TAG }} (${{ github.event.inputs.release_type }})"
          files: |
            PCW-${{ env.VERSION }}.zip
            PCW-${{ env.VERSION }}.zip.sha256
            *.sigstore.json
          draft: true
          prerelease: ${{ github.event.inputs.release_type == '测试版' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Job 2: 全量测试
  # ==========================================
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phpschool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: pdo, pdo_mysql, curl, zip

    - name: 0. 初始化环境与安装
      run: |
        php -S 127.0.0.1:8000 &
        sleep 5
        cat <<EOF > install_data.txt
        site_name=TestSite
        admin_email=a@b.com
        admin_user=admin
        admin_pass=123456
        db_host=127.0.0.1
        db_name=phpschool_test
        db_user=root
        db_pass=root
        allow_register=on
        require_approval=on
        limit_private_msg=on
        EOF
        
        curl -s -X POST -d @install_data.txt "http://127.0.0.1:8000/install.php?step=2" > install_res.html
        if [ ! -f .env ]; then cat install_res.html; exit 1; fi
        echo "✅ 安装成功"

    - name: 1. 账号模块
      run: |
        cat <<EOF > reg_data.txt
        username=user1
        pwd=123456
        email=u@t.com
        EOF
        curl -s -X POST -d @reg_data.txt "http://127.0.0.1:8000/index.php?action=register" > /dev/null
        STATUS=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM users WHERE username='user1'" | tr -d '\r\n')
        if [ "$STATUS" != "pending" ]; then echo "❌ 注册状态异常: $STATUS"; exit 1; fi
        
        cat <<EOF > login_data.txt
        username=admin
        password=123456
        EOF
        curl -s -c admin_cookie.txt -X POST -d @login_data.txt "http://127.0.0.1:8000/index.php?action=login" > login_res.html
        if ! grep -q "PHPSESSID" admin_cookie.txt; then echo "❌ admin 登录失败"; cat login_res.html; exit 1; fi
        
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/admin.php?action=approve&id=2" > /dev/null
        STATUS=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM users WHERE uid=2" | tr -d '\r\n')
        if [ "$STATUS" != "active" ]; then echo "❌ 审核失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "mode=profile&nickname=超级管理员&bio=测试&gender=male&grade=高二&class_name=3班&show_info=1" "http://127.0.0.1:8000/profile.php" > /dev/null
        INFO=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT grade FROM users WHERE username='admin'" | tr -d '\r\n')
        if [ "$INFO" != "高二" ]; then echo "❌ 资料修改失败"; exit 1; fi
        echo "✅ 账号模块通过"

    - name: 2. 帖子模块
      run: |
        curl -s -b admin_cookie.txt -X POST -d "content=SecretPost&pwd=123456" "http://127.0.0.1:8000/index.php?action=post" > /dev/null
        curl -s -b admin_cookie.txt -X POST -d "content=NormalPost" "http://127.0.0.1:8000/index.php?action=post" > /dev/null
        PID2=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(pid) FROM posts" | tr -d '\r\n')
        curl -s -b admin_cookie.txt -X POST -d "pid=$PID2&content=TestComment&is_anon=1" "http://127.0.0.1:8000/index.php?action=comment" > /dev/null
        curl -s -b admin_cookie.txt -X POST -d "pid=$PID2" "http://127.0.0.1:8000/index.php?action=like" > /dev/null
        L1=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT COUNT(*) FROM likes WHERE pid=$PID2" | tr -d '\r\n')
        if [ "$L1" != "1" ]; then echo "❌ 帖子操作失败"; exit 1; fi
        echo "✅ 帖子模块通过"

    - name: 3. 私聊模块
      run: |
        printf '\x47\x49\x46\x38\x39\x61\x01\x00\x01\x00\x80\x00\x00\x00\x00\x00\xff\xff\xff\x21\xf9\x04\x01\x00\x00\x00\x00\x2c\x00\x00\x00\x00\x01\x00\x01\x00\x00\x02\x02\x44\x01\x00\x3b' > test_image.gif
        curl -s -b admin_cookie.txt -X POST -F "to=1" -F "content=TestMsg" -F "file=@test_image.gif" "http://127.0.0.1:8000/send_msg.php" > /dev/null
        MID=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(mid) FROM messages" | tr -d '\r\n')
        curl -s -b admin_cookie.txt -X POST -d "mid=$MID" "http://127.0.0.1:8000/send_msg.php?action=recall" > /dev/null
        DELETED=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT deleted FROM messages WHERE mid=$MID" | tr -d '\r\n')
        if [ "$DELETED" != "1" ]; then echo "❌ 私聊操作失败"; exit 1; fi
        echo "✅ 私聊模块通过"

    - name: 4. 集市模块
      run: |
        curl -s -b admin_cookie.txt -X POST -F "add_item=1" -F "title=TestItem" -F "price=100" -F "desc_text=Desc" -F "image=@test_image.gif" "http://127.0.0.1:8000/market.php" > /dev/null
        ITEM=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(id) FROM market_items" | tr -d '\r\n')
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/market.php?action=change_status&id=$ITEM" > /dev/null
        ST=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM market_items WHERE id=$ITEM" | tr -d '\r\n')
        if [ "$ST" != "0" ]; then echo "❌ 集市上下架失败"; exit 1; fi
        echo "✅ 集市模块通过"

    - name: 5. 后台模块与平滑升级
      run: |
        curl -s -b admin_cookie.txt -X POST -d "mode=edit_user&tid=2&points=9999" "http://127.0.0.1:8000/admin.php" > /dev/null
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/admin.php?action=toggle_status&id=2" > /dev/null
        NG=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT ng FROM users WHERE uid=2" | tr -d '\r\n')
        if [ "$NG" != "1" ]; then echo "❌ 后台操作失败"; exit 1; fi
        
        curl -s "http://127.0.0.1:8000/install.php" > upgrade_res.html
        if ! grep -q "升级成功\|已是最新" upgrade_res.html; then 
            echo "❌ 平滑升级验证失败"
            cat upgrade_res.html
            exit 1; 
        fi
        echo "✅ 后台与升级模块通过"0.0.1:8000/install.php" > upgrade_res.html
        if ! grep -q "升级成功\|已是最新" upgrade_res.html; then 
            echo "❌ 平滑升级验证失败"
            cat upgrade_res.html
            exit 1; 
        fi
        echo "✅ 后台与升级模块通过"
