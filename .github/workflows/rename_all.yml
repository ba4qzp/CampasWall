name: 一键全局改名 (终极无死角版)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动替换所有大小写并提交
        run: |
          FILES=".php .md .html .kt .gradle .xml .json"
          
          # 1. 处理普通连续字符串 (如 PHPSchool, phpschool)
          find . -type f \( $(for ext in $FILES; do echo -n "-name \"*$ext\" -o "; done | sed 's/-o $//') \) ! -path "./.git/*" ! -path "./.github/*" -exec sed -i 's/PHPSchool/PHPCampus/g' {} +
          find . -type f \( $(for ext in $FILES; do echo -n "-name \"*$ext\" -o "; done | sed 's/-o $//') \) ! -path "./.git/*" ! -path "./.github/*" -exec sed -i 's/phpschool/phpcampus/g' {} +
          find . -type f \( $(for ext in $FILES; do echo -n "-name \"*$ext\" -o "; done | sed 's/-o $//') \) ! -path "./.git/*" ! -path "./.github/*" -exec sed -i 's/PHPSCHOOL/PHPCAMPUS/g' {} +

          # 2. 处理被 HTML 标签隔开的情况 (如 <span>School</span>)
          find . -type f \( $(for ext in $FILES; do echo -n "-name \"*$ext\" -o "; done | sed 's/-o $//') \) ! -path "./.git/*" ! -path "./.github/*" -exec sed -i 's|<span>School</span>|<span>Campus</span>|g' {} +
          find . -type f \( $(for ext in $FILES; do echo -n "-name \"*$ext\" -o "; done | sed 's/-o $//') \) ! -path "./.git/*" ! -path "./.github/*" -exec sed -i 's|<span>school</span>|<span>campus</span>|g' {} +

          # 3. 提交更改
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          
          if ! git diff --quiet; then
            git commit -m "chore: 终极全局替换 (含 span 标签隔开场景)"
            git push
            echo "✅ 替换成功并已提交！"
          else
            echo "💡 没找到需要替换的内容。"
          fi

      - name: 自动销毁本工作流文件
        run: |
          WORKFLOW_PATH=$(echo "${{ github.workflow_ref }}" | cut -d'@' -f1 | sed 's|^[^/]*/[^/]*/||')
          gh api --method DELETE repos/${{ github.repository }}/contents/$WORKFLOW_PATH \
            -f message="Auto-destroy: Rename finished" \
            -f sha=$(gh api repos/${{ github.repository }}/contents/$WORKFLOW_PATH --jq .sha)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
