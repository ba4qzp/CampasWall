name: Full Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phpschool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: pdo, pdo_mysql, curl, zip

    - name: 0. 初始化环境与安装
      run: |
        php -S 127.0.0.1:8000 &
        sleep 5
        curl -s -X POST -d "site_name=TestSite&admin_email=a@b.com&admin_user=admin&admin_pass=123456&db_host=127.0.0.1&db_name=phpschool_test&db_user=root&db_pass=root&allow_register=on&require_approval=on&limit_private_msg=on" "http://127.0.0.1:8000/install.php?step=2" > install_res.html
        if [ ! -f .env ]; then cat install_res.html; exit 1; fi
        echo "✅ 安装成功"
        
        mysql -h 127.0.0.1 -u root -proot phpschool_test -e "UPDATE users SET status='active' WHERE username='admin'" 2>/dev/null || true
        HASH=$(php -r "echo password_hash('123456', PASSWORD_DEFAULT);")
        mysql -h 127.0.0.1 -u root -proot phpschool_test -e "UPDATE users SET password_hash='$HASH' WHERE username='admin'" 2>/dev/null

    - name: 1. 账号模块 (注册、审核、新字段资料修改)
      run: |
        curl -s -X POST -d "username=user1&pwd=123456&email=u@t.com" "http://127.0.0.1:8000/index.php?action=register" > /dev/null
        STATUS=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM users WHERE username='user1'" | tr -d '\r\n')
        if [ "$STATUS" != "pending" ]; then echo "❌ 注册状态异常: $STATUS"; exit 1; fi
        
        curl -s -c admin_cookie.txt -X POST -d "username=admin&pwd=123456" "http://127.0.0.1:8000/index.php?action=login" > /dev/null
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/admin.php?action=approve&id=2" > /dev/null
        STATUS=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM users WHERE uid=2" | tr -d '\r\n')
        if [ "$STATUS" != "active" ]; then echo "❌ 审核失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "mode=profile&nickname=超级管理员&bio=测试&gender=male&grade=高二&class_name=3班&show_info=1" "http://127.0.0.1:8000/profile.php" > /dev/null
        INFO=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT grade FROM users WHERE username='admin'" | tr -d '\r\n')
        if [ "$INFO" != "高二" ]; then echo "❌ 资料修改失败"; exit 1; fi
        echo "✅ 账号模块通过"

    - name: 2. 帖子模块 (密码帖、评论、点赞、删评)
      run: |
        curl -s -b admin_cookie.txt -X POST -d "content=SecretPost&pwd=123456" "http://127.0.0.1:8000/index.php?action=post" > /dev/null
        PID=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(pid) FROM posts" | tr -d '\r\n')
        PWD_DB=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT password FROM posts WHERE pid=$PID" | tr -d '\r\n')
        if [ "$PWD_DB" != "123456" ]; then echo "❌ 密码帖入库失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "content=NormalPost" "http://127.0.0.1:8000/index.php?action=post" > /dev/null
        PID2=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(pid) FROM posts" | tr -d '\r\n')

        curl -s -b admin_cookie.txt -X POST -d "pid=$PID2&content=TestComment&is_anon=1" "http://127.0.0.1:8000/index.php?action=comment" > /dev/null
        C_ANON=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT is_anon FROM comments WHERE pid=$PID2" | tr -d '\r\n')
        if [ "$C_ANON" != "1" ]; then echo "❌ 匿名评论失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "pid=$PID2" "http://127.0.0.1:8000/index.php?action=like" > /dev/null
        L1=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT COUNT(*) FROM likes WHERE pid=$PID2" | tr -d '\r\n')
        if [ "$L1" != "1" ]; then echo "❌ 点赞失败"; exit 1; fi

        CID=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(cid) FROM comments WHERE pid=$PID2" | tr -d '\r\n')
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/index.php?action=del_comment&cid=$CID" > /dev/null
        C_COUNT=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT COUNT(*) FROM comments WHERE pid=$PID2" | tr -d '\r\n')
        if [ "$C_COUNT" != "0" ]; then echo "❌ 删除评论失败"; exit 1; fi
        echo "✅ 帖子模块通过"

    - name: 3. 私聊模块 (发文字、发文件、撤回)
      run: |
        printf '\x47\x49\x46\x38\x39\x61\x01\x00\x01\x00\x80\x00\x00\x00\x00\x00\xff\xff\xff\x21\xf9\x04\x01\x00\x00\x00\x00\x2c\x00\x00\x00\x00\x01\x00\x01\x00\x00\x02\x02\x44\x01\x00\x3b' > test_image.gif
        curl -s -b admin_cookie.txt -X POST -F "to=1" -F "content=TestMsg" -F "file=@test_image.gif" "http://127.0.0.1:8000/send_msg.php" > /dev/null
        MID=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(mid) FROM messages" | tr -d '\r\n')
        FILE=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT file_path FROM messages WHERE mid=$MID" | tr -d '\r\n')
        if [ -z "$FILE" ]; then echo "❌ 文件上传失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "mid=$MID" "http://127.0.0.1:8000/send_msg.php?action=recall" > /dev/null
        DELETED=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT deleted FROM messages WHERE mid=$MID" | tr -d '\r\n')
        if [ "$DELETED" != "1" ]; then echo "❌ 撤回失败"; exit 1; fi
        echo "✅ 私聊模块通过"

    - name: 4. 集市模块 (发带图物品、WAF防拦截新路由测试)
      run: |
        curl -s -b admin_cookie.txt -X POST -F "add_item=1" -F "title=TestItem" -F "price=100" -F "desc_text=Desc" -F "image=@test_image.gif" "http://127.0.0.1:8000/market.php" > /dev/null
        ITEM=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT MAX(id) FROM market_items" | tr -d '\r\n')
        IMG=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT image_path FROM market_items WHERE id=$ITEM" | tr -d '\r\n')
        if [ -z "$IMG" ]; then echo "❌ 集市发图失败"; exit 1; fi
        
        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/market.php?action=change_status&id=$ITEM" > /dev/null
        ST=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM market_items WHERE id=$ITEM" | tr -d '\r\n')
        if [ "$ST" != "0" ]; then echo "❌ 下架失败"; exit 1; fi

        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/market.php?action=change_status&id=$ITEM" > /dev/null
        ST=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT status FROM market_items WHERE id=$ITEM" | tr -d '\r\n')
        if [ "$ST" != "1" ]; then echo "❌ 上架失败"; exit 1; fi
        echo "✅ 集市模块通过"

    - name: 5. 后台模块 (WAF防拦截冻结、公告、平滑升级检测)
      run: |
        curl -s -b admin_cookie.txt -X POST -d "mode=edit_user&tid=2&points=9999" "http://127.0.0.1:8000/admin.php" > /dev/null
        PTS=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT points FROM users WHERE uid=2" | tr -d '\r\n')
        if [ "$PTS" != "9999" ]; then echo "❌ 改分失败"; exit 1; fi

        curl -s -b admin_cookie.txt "http://127.0.0.1:8000/admin.php?action=toggle_status&id=2" > /dev/null
        NG=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT ng FROM users WHERE uid=2" | tr -d '\r\n')
        if [ "$NG" != "1" ]; then echo "❌ 冻结失败"; exit 1; fi

        curl -s -b admin_cookie.txt -X POST -d "mode=announce&content=NewAnnounce" "http://127.0.0.1:8000/admin.php" > /dev/null
        ANN=$(mysql -h 127.0.0.1 -u root -proot phpschool_test -N -e "SELECT content FROM announcements WHERE aid=1" | tr -d '\r\n')
        if [ "$ANN" != "NewAnnounce" ]; then echo "❌ 公告失败"; exit 1; fi

        curl -s "http://127.0.0.1:8000/install.php" > upgrade_res.html
        if grep -q "升级成功" upgrade_res.html || grep -q "已是最新" upgrade_res.html; then
            echo "✅ 平滑升级模块通过"
        else
            cat upgrade_res.html
            echo "❌ 平滑升级验证失败"
            exit 1
        fi
        echo "✅ 测试全绿！"
