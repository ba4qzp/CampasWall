name: Auto Test All Features

on:
  push:
    branches: [ "main" ]

jobs:
  test-install:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phpschool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: pdo, pdo_mysql

    - name: Start PHP Server
      run: |
        php -S 127.0.0.1:8000 &
        sleep 5

    - name: Run Install
      run: |
        curl -s -X POST -d "site_name=TestSite&admin_email=a@b.com&admin_user=admin&admin_pass=123456&db_host=127.0.0.1&db_name=phpschool_test&db_user=root&db_pass=root&allow_register=on&require_approval=on&limit_private_msg=on" http://127.0.0.1:8000/install.php?step=2 > install_res.html
        if [ ! -f .env ]; then cat install_res.html; exit 1; fi

    - name: Test All Features (via PHP)
      run: |
        cat << 'EOF' > test_all.php
        <?php
        $pdo = new PDO("mysql:host=127.0.0.1;dbname=phpschool_test;charset=utf8mb4", "root", "root");
        $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
        
        function request($url, $data, $cookieFile, $method = 'POST') {
            $ch = curl_init($url);
            curl_setopt_array($ch, [
                CURLOPT_POST => $method === 'POST',
                CURLOPT_POSTFIELDS => $method === 'POST' ? http_build_query($data) : '',
                CURLOPT_COOKIEJAR => $cookieFile,
                CURLOPT_COOKIEFILE => $cookieFile,
                CURLOPT_RETURNTRANSFER => true
            ]);
            $res = curl_exec($ch);
            curl_close($ch);
            return $res;
        }

        // 1. 【新增】测试真实用户注册 (user1)
        request('http://127.0.0.1:8000/index.php?action=register', [
            'username' => 'user1', 
            'password' => '123456',
            'email' => 'user1@test.com'
        ], 'user1_cookies.txt');
        
        // 验证注册是否入库，且状态为 pending (因为开启了人工审核)
        $stmt = $pdo->query("SELECT status FROM users WHERE username='user1'");
        $user1 = $stmt->fetch();
        if(!$user1 || $user1['status'] !== 'pending') {
            echo "❌ 测试失败：注册未成功入库或状态不是 pending\n";
            exit(1);
        }

        // 2. 【新增】模拟管理员在后台点击“通过”
        request('http://127.0.0.1:8000/index.php?action=login', ['username'=>'admin', 'password'=>'123456'], 'admin_cookies.txt');
        request('http://127.0.0.1:8000/admin.php?action=approve&id=2', [], 'admin_cookies.txt', 'GET');
        
        // 验证 user1 状态变为 active
        $stmt = $pdo->query("SELECT status FROM users WHERE username='user1'");
        if($stmt->fetchColumn() !== 'active') {
            echo "❌ 测试失败：管理员审核通过失败\n";
            exit(1);
        }

        // 3. 测试 admin 发帖
        request('http://127.0.0.1:8000/index.php?action=post', ['content'=>'这是admin的测试帖'], 'admin_cookies.txt');
        $pid = $pdo->lastInsertId();
        
        // 4. 测试 user1 登录
        request('http://127.0.0.1:8000/index.php?action=login', ['username'=>'user1', 'password'=>'123456'], 'user1_cookies.txt');
        
        // 5. 测试 user1 评论
        request('http://127.0.0.1:8000/index.php?action=comment', ['pid'=>$pid, 'content'=>'这是user1的评论'], 'user1_cookies.txt');
        
        // 6. 测试 user1 点赞
        request('http://127.0.0.1:8000/index.php?action=like', ['pid'=>$pid], 'user1_cookies.txt');
        
        // 7. 测试 user1 私聊 admin
        request('http://127.0.0.1:8000/send_msg.php', ['to'=>1, 'content'=>'这是user1发的私聊'], 'user1_cookies.txt');
        
        // 8. 测试 user1 在集市上架物品 (标价 100 积分)
        request('http://127.0.0.1:8000/market.php', ['add_item'=>1, 'title'=>'测试物品', 'price'=>100, 'desc_text'=>'描述'], 'user1_cookies.txt');
        $itemId = $pdo->lastInsertId();
        
        // 9. 测试 admin 购买物品
        $beforePoints = (int)$pdo->query("SELECT points FROM users WHERE uid=1")->fetchColumn();
        request("http://127.0.0.1:8000/market.php?buy=$itemId", [], 'admin_cookies.txt', 'GET');
        $afterPoints = (int)$pdo->query("SELECT points FROM users WHERE uid=1")->fetchColumn();

        // ====== 数据库终极验证 ======
        $errors = [];
        
        $cCount = (int)$pdo->query("SELECT COUNT(*) FROM comments WHERE pid=$pid")->fetchColumn();
        if($cCount !== 1) $errors[] = "评论失败";
        
        $lCount = (int)$pdo->query("SELECT COUNT(*) FROM likes WHERE pid=$pid")->fetchColumn();
        if($lCount !== 1) $errors[] = "点赞失败";
        
        $mCount = (int)$pdo->query("SELECT COUNT(*) FROM messages WHERE from_uid=2 AND to_uid=1")->fetchColumn();
        if($mCount !== 1) $errors[] = "私聊失败";
        
        if($beforePoints - $afterPoints !== 100) {
            $errors[] = "集市购买扣款失败 (前:{$beforePoints}, 后:{$afterPoints})";
        }

        if(empty($errors)) {
            echo "✅ 全功能测试通过！注册、审核、发帖、评论、点赞、私聊、集市买卖，全部逻辑正常！\n";
        } else {
            echo "❌ 测试失败：\n" . implode("\n", $errors) . "\n";
            exit(1);
        }
        EOF
        php test_all.php
