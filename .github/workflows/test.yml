name: Auto Test Core Features

on:
  push:
    branches: [ "main" ]

jobs:
  test-install:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phpschool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: pdo, pdo_mysql

    - name: Start PHP Server
      run: |
        php -S 127.0.0.1:8000 &
        sleep 5

    - name: Run Install
      run: |
        curl -s -X POST -d "site_name=TestSite&admin_email=a@b.com&admin_user=admin&admin_pass=123456&db_host=127.0.0.1&db_name=phpschool_test&db_user=root&db_pass=root&allow_register=on&require_approval=on&limit_private_msg=on" http://127.0.0.1:8000/install.php?step=2 > install_res.html
        if [ ! -f .env ]; then 
          echo "❌ 安装失败！"
          cat install_res.html
          exit 1
        fi
        echo "✅ 安装成功"

    - name: Test Login
      run: |
        # 用 curl 模拟登录，拿到 Cookie 存进文件
        curl -s -c cookies.txt -X POST -d "username=admin&password=123456" "http://127.0.0.1:8000/index.php?action=login"

    - name: Test Post & Verify with PHP
      run: |
        # 写一个临时 PHP 脚本，用 PHP 去发帖并查库
        cat << 'EOF' > test_post.php
        <?php
        // 1. 读取 Curl 拿到的 Cookie
        $cookieStr = '';
        if(file_exists('cookies.txt')){
            $lines = file('cookies.txt', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
            $cookies = [];
            foreach($lines as $line){
                if(strpos($line, "\t") !== false){
                    $parts = explode("\t", $line);
                    if(count($parts) >= 7) $cookies[] = $parts[5] . '=' . $parts[6];
                }
            }
            $cookieStr = implode('; ', $cookies);
        }

        // 2. 用 PHP 发送中文发帖请求 (PHP 完美支持 UTF-8)
        $url = 'http://127.0.0.1:8000/index.php?action=post';
        $data = http_build_query([
            'content' => '这是GitHub自动测试发出的中文帖子',
            'tags' => '中文测试'
        ]);
        
        $ch = curl_init($url);
        curl_setopt_array($ch, [
            CURLOPT_POST => true,
            CURLOPT_POSTFIELDS => $data,
            CURLOPT_COOKIE => $cookieStr,
            CURLOPT_RETURNTRANSFER => true
        ]);
        $res = curl_exec($ch);
        curl_close($ch);

        // 3. 连接数据库验证
        $pdo = new PDO("mysql:host=127.0.0.1;dbname=phpschool_test;charset=utf8mb4", "root", "root");
        $stmt = $pdo->query("SELECT content FROM posts ORDER BY pid DESC LIMIT 1");
        $row = $stmt->fetch(PDO::FETCH_ASSOC);

        // 4. 比对结果
        if ($row && $row['content'] === '这是GitHub自动测试发出的中文帖子') {
            echo "✅ 测试通过！中文帖子完美入库无乱码。\n";
        } else {
            echo "❌ 测试失败！实际查出的内容: " . ($row ? $row['content'] : '空') . "\n";
            exit(1);
        }
        EOF
        
        # 执行 PHP 脚本
        php test_post.php
