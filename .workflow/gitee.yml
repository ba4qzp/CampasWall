name: 自动切换为 Gitee 路径

on:
  push:
      branches: [ "main" ]
        workflow_dispatch:

        jobs:
          replace:
              runs-on: ubuntu-latest
                  steps:
                        - name: Checkout Code
                                uses: actions/checkout@v4
                                        with:
                                                  # 这里利用 token 拉取代码，防止权限报错
                                                            token: ${{ secrets.GITEE_TOKEN }} 

                                                                  - name: 替换为 Gitee 路径并推送
                                                                          run: |
                                                                                    G_USER="BA4QZP"
                                                                                              G_REPO="PHPCampus"
                                                                                                        GITEE_USER="ba4qzp"
                                                                                                                  GITEE_REPO="PHPCampus"
                                                                                                                            
                                                                                                                                      FILES=$(grep -rl "github.com/$G_USER/$G_REPO" . --exclude-dir=.git --exclude-dir=.github --exclude-dir=.gitee || true)
                                                                                                                                                
                                                                                                                                                          if [ -n "$FILES" ]; then
                                                                                                                                                                      for file in $FILES; do
                                                                                                                                                                                    sed -i "s|github.com/$G_USER/$G_REPO|gitee.com/$GITEE_USER/$GITEE_REPO|g" "$file"
                                                                                                                                                                                                done
                                                                                                                                                                                                            
                                                                                                                                                                                                                        git config --global user.name "Auto Bot"
                                                                                                                                                                                                                                    git config --global user.email "bot@gitee.com"
                                                                                                                                                                                                                                                git add .
                                                                                                                                                                                                                                                            if ! git diff --staged --quiet; then
                                                                                                                                                                                                                                                                          git commit -m "Auto-replace to Gitee links [skip ci]"
                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                      # ★ 关键：把 token 塞进 push 的 URL 里，强制拥有推送权限
                                                                                                                                                                                                                                                                                                                    git push https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ github.repository }}.git HEAD:main
                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                          else
                                                                                                                                                                                                                                                                                                                                                      echo "💡 已经是 Gitee 路径，无需替换"
                                                                                                                                                                                                                                                                                                                                                                fi